spring.application.name=foodmanager

server.port=8085


spring.datasource.url=jdbc:h2:file:./data/foodmanager-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

foodmanager.storage.image-dir=./data/images
foodmanager.expiring-soon-days=7

# Tägliche Ablauf-Benachrichtigung per ntfy (https://ntfy.sh). Ohne Topic ausgeschaltet.
# Das Topic ist wie ein Passwort: jeder, der den Namen kennt, kann mitlesen. Also lang und zufällig wählen.
foodmanager.notify.ntfy-server=${FOODMANAGER_NTFY_SERVER:https://ntfy.sh}
foodmanager.notify.ntfy-topic=${FOODMANAGER_NTFY_TOPIC:}
foodmanager.notify.ntfy-token=${FOODMANAGER_NTFY_TOKEN:}
foodmanager.notify.cron=${FOODMANAGER_NOTIFY_CRON:0 30 18 * * *}
foodmanager.notify.zone=Europe/Vienna

foodmanager.keycloak.public-url=${KEYCLOAK_PUBLIC_URL:${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/foodmanager}}
foodmanager.keycloak.internal-url=${KEYCLOAK_INTERNAL_URL:${foodmanager.keycloak.public-url}}
foodmanager.keycloak.client-id=${KEYCLOAK_CLIENT_ID:foodmanager-web}
foodmanager.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:foodmanager-web-secret}
foodmanager.public-url=${PUBLIC_URL:}

server.forward-headers-strategy=framework

server.ssl.enabled=false