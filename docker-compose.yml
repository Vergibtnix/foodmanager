services:
  foodmanager-db:
    image: postgres:16-alpine
    container_name: foodmanager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FOODMANAGER_DB_NAME:-foodmanager}
      POSTGRES_USER: ${FOODMANAGER_DB_USER:-foodmanager}
      POSTGRES_PASSWORD: ${FOODMANAGER_DB_PASSWORD:-foodmanager}
    ports:
      - "${FOODMANAGER_DB_PORT:-5432}:5432"
    volumes:
      - foodmanager-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.6
    container_name: foodmanager-keycloak
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_HTTP_PORT: 8080
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./src/main/resources/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      foodmanager-db:
        condition: service_healthy

volumes:
  foodmanager-postgres-data:

